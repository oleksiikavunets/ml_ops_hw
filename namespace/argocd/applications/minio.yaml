apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 14.x.x
    chart: minio
    helm:
      values: |
        mode: standalone
        buckets:
          - name: mlflow-artifacts
            policy: none
            purge: false
        auth:
          rootUser: admin
          rootPassword: admin12345
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
